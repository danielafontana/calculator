services:
  backend:
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-1.0.0}
    # Not published to the host: only reachable by nginx on the internal network.
    expose:
      - "8080"
    environment:
      PORT: 8080
      # Requests arrive same-origin through nginx; CORS only matters if the
      # API is called from another origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:3443}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${HTTP_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"
    environment:
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-3443}
    # Production: mount real certificates (fullchain.pem + privkey.pem).
    # Without them, a self-signed certificate is generated on startup.
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
