services:
  backend:
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Vite embeds this at build time: it is the URL the *browser* uses to
        # reach the API, so it points to the published backend port.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
