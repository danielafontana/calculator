name: Release backend

# Push a backend/vX.Y.Z tag to release the backend on its own:
#   git tag -a backend/v1.1.0 -m "backend 1.1.0" && git push origin backend/v1.1.0
on:
  push:
    tags: ["backend/v*"]

permissions:
  contents: read

concurrency:
  group: release-backend
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/backend.yml

  publish:
    needs: checks
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-image.yml
    with:
      component: backend
