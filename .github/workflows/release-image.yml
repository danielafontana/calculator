name: Release image

# Reusable: builds, scans, publishes, signs and releases one component from its
# <component>/vX.Y.Z tag. Called by release-backend.yml and release-frontend.yml.
on:
  workflow_call:
    inputs:
      component:
        description: "backend or frontend (also the directory and tag prefix)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      packages: write # push to GHCR
      id-token: write # keyless signing with cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need the previous tag

      - name: Resolve version and image
        id: meta
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          version="${GITHUB_REF_NAME#"$COMPONENT"/v}"
          if [[ "$GITHUB_REF_NAME" != "$COMPONENT/v"* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not $COMPONENT/vX.Y.Z"; exit 1
          fi
          # GHCR requires lowercase repository names.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calculator-$COMPONENT"
          tags="$image:$version"
          # Stable releases also move the X.Y and latest tags; pre-releases do not.
          if [[ "$version" != *-* ]]; then
            tags="$tags,$image:${version%.*},$image:latest"
          fi
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Check package.json version
        if: inputs.component == 'frontend'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          actual="$(jq -r .version frontend/package.json)"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::frontend/package.json is $actual but the tag is $VERSION"; exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan before publishing: nothing with a fixable HIGH/CRITICAL CVE is pushed.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.component }}
          pull: true
          load: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:scan

      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.component }}
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # SBOM and SLSA provenance attached to the image as attestations.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Notes list only this component's commits since its previous release.
          prev="$(git describe --tags --abbrev=0 --match "$COMPONENT/v*" "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          {
            echo "Image: \`$IMAGE:$VERSION\`"
            echo "Digest: \`$DIGEST\` (signed with cosign, keyless)"
            echo
            echo "### Changes in $COMPONENT${prev:+ since $prev}"
            git log --pretty='- %s (%h)' "$range" -- "$COMPONENT/"
          } > notes.md
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$COMPONENT v$VERSION" \
            --notes-file notes.md "${flags[@]}"
