name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run: base images and dependencies get new CVEs without code changes.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tags can be moved);
# Dependabot keeps the SHAs and version comments up to date.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the current stable line (security fixes included).
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
      - name: Verify modules
        run: go mod verify
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          {
            echo "### Backend coverage"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: |
            backend/coverage.html
            backend/coverage.out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node LTS line from .nvmrc; check-latest picks its newest patch.
          node-version-file: frontend/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Registry signatures
        run: npm audit signatures
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary
      - name: Coverage summary
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: calculator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose build --pull
      - name: Image scan (backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calculator-backend:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Image scan (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calculator-frontend:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: SBOM backend (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calculator-backend:latest
          format: cyclonedx
          output: sbom-backend.cdx.json
          skip-setup-trivy: true
      - name: SBOM frontend (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calculator-frontend:latest
          format: cyclonedx
          output: sbom-frontend.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-*.cdx.json
      - name: Start stack
        run: docker compose up -d --wait
      - name: Smoke test
        run: |
          # HTTP only redirects to HTTPS
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/)" \
            = "301 https://localhost:3443/"
          # SPA and API share the HTTPS origin (self-signed certificate, hence -k)
          curl -fsSk https://localhost:3443/ | grep -q '<div id="root">'
          curl -fsSk https://localhost:3443/api/v1/health
          curl -fsSk -X POST https://localhost:3443/api/v1/calculate \
            -H 'Content-Type: application/json' -d '{"operation":"add","a":1,"b":2}'
          # Security headers are present
          headers=$(curl -sk -D - -o /dev/null https://localhost:3443/)
          for h in content-security-policy x-frame-options x-content-type-options permissions-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "missing $h"; exit 1; }
          done
          # Only forward-secret AEAD ciphers on TLS 1.2
          if echo | openssl s_client -connect localhost:3443 -tls1_2 -cipher AES256-SHA 2>/dev/null | grep -q "Cipher is AES256-SHA"; then
            echo "weak TLS cipher accepted"; exit 1
          fi
          # The backend is not published on the host
          if curl -s --max-time 3 http://localhost:8080/api/v1/health; then
            echo "backend is reachable on the host"; exit 1
          fi
      - name: Tear down
        if: always()
        run: docker compose down
