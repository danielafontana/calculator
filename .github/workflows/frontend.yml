name: Frontend

# Runs only when the frontend changes. Also called by release-frontend.yml, so
# a release goes through exactly the same checks.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  # Weekly run: dependencies and base images get new CVEs without code changes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_call:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tags can be moved);
# Dependabot keeps the SHAs and version comments up to date.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node LTS line from .nvmrc; check-latest picks its newest patch.
          node-version-file: frontend/.nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Registry signatures
        run: npm audit signatures
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run test -- --coverage --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary
      - name: Coverage summary
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --pull -t calculator-frontend:ci frontend
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calculator-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
